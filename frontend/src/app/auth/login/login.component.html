<div class="login-wrapper">
  <div class="login-card">
    <!-- Left Blue Panel -->
    <div class="blue-panel">
      <div class="panel-content">
        <span class="welcome-label">Welcome to</span>
        <h1 class="portal-heading">Power BI Report Automation Portal</h1>
      </div>

      <!-- Cloud Wave Layered Transition -->
      <div class="cloud-wave-transition">
        <svg viewBox="0 0 100 500" preserveAspectRatio="none" class="wave-svg">
          <path d="M0,0 C30,30 65,60 40,110 C15,160 55,200 35,250 C15,300 55,350 35,400 C15,450 40,480 0,500 L100,500 L100,0 Z" fill="#ffffff" opacity="0.35"/>
          <path d="M0,0 C20,25 50,55 25,105 C0,155 42,195 22,245 C2,295 42,345 22,395 C2,445 25,475 0,500 L100,500 L100,0 Z" fill="#ffffff"/>
        </svg>
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="form-panel">
      <h2 class="form-title">Sign in to your account</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <!-- Username Field -->
        <div class="field-container">
          <label class="field-label" for="username">Username / E-mail Address</label>
          <input
            type="text"
            id="username"
            name="username"
            class="line-input"
            [(ngModel)]="username"
            required
            placeholder="Enter your email or username"
            autocomplete="username"
          />
        </div>

        <!-- Password Field -->
        <div class="field-container">
          <label class="field-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="line-input"
            [(ngModel)]="password"
            required
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <!-- Error Banner -->
        <div class="error-banner" *ngIf="errorMessage">
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Admin Notice above Sign In Button -->
        <p class="admin-notice">If you can't log in, please contact the admin.</p>

        <!-- Sign In Button -->
        <div class="button-row">
          <button type="submit" [disabled]="!loginForm.form.valid || loading" class="btn-pill-blue">
            <span *ngIf="loading" class="spinner-white"></span>
            <span>{{ loading ? 'Signing In...' : 'Sign In' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
